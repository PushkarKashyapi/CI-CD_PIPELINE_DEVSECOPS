apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibeshield
  labels:
    app: vibeshield

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vibeshield

  template:
    metadata:
      labels:
        app: vibeshield

    spec:
      containers:
        - name: vibeshield
          image: "${IMAGE_NAME}:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
